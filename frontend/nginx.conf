server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
  # Re-resolve through Docker DNS: a literal upstream is resolved once at startup, so a recreated
  # ingestion container (new IP) left the dashboard returning 502 until nginx restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;
  location /api/ { set $ingestion http://ingestion:8080; proxy_pass $ingestion; proxy_set_header Authorization $http_authorization; }
  location / { try_files $uri $uri/ /index.html; }
}
