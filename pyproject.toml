[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ml*", "services.inference*", "streaming*", "benchmarks*", "scripts*"]
namespaces = false

[project]
name = "fraudstream"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.3", "pandas==3.0.6", "scikit-learn==1.9.1",
  "xgboost==3.4.1", "fastapi==0.141.1", "pydantic==2.13.5",
  "uvicorn==0.54.0", "joblib==1.6.0", "prometheus-client==0.26.0",
  "httpx==0.28.1", "redis==8.1.0", "matplotlib==3.11.2", "mlflow>=3.0,<4",
]
[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.9", "mypy==2.3.1", "fakeredis[lua]==2.38.0"]
[tool.pytest.ini_options]
testpaths = ["tests", "services/inference/tests"]
markers = ["integration: requires real Kafka, PostgreSQL and Redis"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = [".venv", "frontend"]
