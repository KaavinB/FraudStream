name: correctness
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.8'}
      - run: go mod tidy -diff
      - run: test -z "$(gofmt -l internal services/ingestion services/processor services/alerts)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '3.12'}
      - run: uv venv && uv pip install -e '.[dev]'
      - run: .venv/bin/python -m ml.data.generate --customers 200 --days 60
      - run: OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 .venv/bin/python -m ml.training.train
      - run: .venv/bin/python -m ruff check ml services/inference streaming benchmarks scripts tests
      - run: .venv/bin/python -m mypy ml services/inference/app streaming benchmarks
      - run: OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 .venv/bin/python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci && npm run build
        working-directory: frontend
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '3.12'}
      - run: uv venv && uv pip install -e '.[dev]'
      - run: .venv/bin/python scripts/setup.py
      - run: .venv/bin/python -m ml.data.generate --customers 200 --days 60
      - run: OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 .venv/bin/python -m ml.training.train
      - run: docker compose up -d --build
      - run: .venv/bin/python scripts/wait_ready.py
      - run: .venv/bin/python -m scripts.integration
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: integration-measurements, path: benchmarks/results}
      - run: docker compose logs --no-color && docker compose down
        if: always()
